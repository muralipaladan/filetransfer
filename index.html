<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <title>KUMBIDI - P2P File Transfer</title>
    <!-- Libraries for fast loading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; background: #f4f7f6; color: #333; }
        .box { background: white; padding: 25px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 420px; max-width: 90%; }
        input[type="file"] { border: 1px solid #ccc; padding: 10px; border-radius: 6px; width: 90%; background: #fafafa; margin-bottom: 15px; }
        button { background: #007bff; color: white; border: none; padding: 12px; width: 95%; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        #qrcode { margin: 20px auto; display: flex; justify-content: center; background: #fff; padding: 10px; border-radius: 6px; width: fit-content; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        #status { font-weight: bold; color: #d9534f; margin-top: 15px; font-size: 15px; }
        .progress-bar { width: 100%; background: #e0e0e0; border-radius: 5px; margin-top: 15px; overflow: hidden; height: 14px; display: none; }
        .progress-fill { width: 0%; height: 100%; background: #28a745; transition: width 0.1s ease; }
    </style>
</head>
<body>

<div class="box">
    <h2>KUMBIDI P2P Share</h2>
    
    <!-- System A: Sender Section -->
    <div id="sender-section">
        <p style="font-size: 14px; color: #666;">Connect via same Wi-Fi or Hotspot</p>
        <input type="file" id="fileInput">
        <br>
        <button onclick="startHosting()">Generate QR Code</button>
        <div id="qrcode"></div>
        <p id="status"></p>
    </div>

    <!-- System B: Receiver Section -->
    <div id="receiver-section" style="display:none;">
        <h3 id="receive-title">Receiving File...</h3>
        <p id="receive-status">Connecting...</p>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>
</div>

<script>
    // GitHub Page Base URL
    const BASE_URL = "https://muralipaladan.github.io/filetransfer/";
    
    const urlParams = new URLSearchParams(window.location.search);
    const targetPeerId = urlParams.get('peer');

    if (targetPeerId) {
        // --- System B (Receiver Mode) ---
        document.getElementById('sender-section').style.display = 'none';
        document.getElementById('receiver-section').style.display = 'block';
        
        const peer = new Peer();
        peer.on('open', (id) => {
            const conn = peer.connect(targetPeerId);
            
            conn.on('open', () => {
                document.getElementById('receive-status').innerText = "Connected! Receiving file data...";
                document.getElementById('progressBar').style.display = 'block';
            });

            let receivedSize = 0;
            let totalSize = 0;
            let fileChunks = [];
            let fileMeta = null;

            conn.on('data', (data) => {
                if (data.type === 'meta') {
                    fileMeta = data;
                    totalSize = data.size;
                    document.getElementById('receive-title').innerText = `Downloading ${fileMeta.fileName}`;
                } else if (data.type === 'chunk') {
                    fileChunks.push(data.payload);
                    receivedSize += data.payload.byteLength;
                    
                    let percent = Math.round((receivedSize / totalSize) * 100);
                    document.getElementById('progressFill').style.width = percent + '%';
                    document.getElementById('receive-status').innerText = `Download progress: ${percent}%`;

                    if (receivedSize === totalSize) {
                        const blob = new Blob(fileChunks, { type: fileMeta.fileType });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileMeta.fileName;
                        a.click();
                        document.getElementById('receive-status').innerText = "File download completed successfully!";
                    }
                }
            });

            conn.on('error', (err) => {
                document.getElementById('receive-status').innerText = "Connection lost!";
            });
        });

    } else {
        // --- System A (Sender Mode) ---
        let peer = null;
        
        function startHosting() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) {
                alert("Please select a file first!");
                return;
            }

            document.getElementById('status').innerText = "Setting up connection...";
            
            if(peer) { peer.destroy(); }

            peer = new Peer();

            peer.on('open', (id) => {
                const shareLink = `${BASE_URL}?peer=${id}`;

                const qrContainer = document.getElementById("qrcode");
                qrContainer.innerHTML = "";
                
                new QRCode(qrContainer, {
                    text: shareLink,
                    width: 200,
                    height: 200,
                    correctLevel: QRCode.CorrectLevel.M
                });

                document.getElementById('status').innerText = "Scan QR code using phone camera!";
            });

            peer.on('connection', (conn) => {
                document.getElementById('status').innerText = "Device connected, starting file transfer...";
                const file = fileInput.files[0];
                
                conn.on('open', () => {
                    conn.send({
                        type: 'meta',
                        fileName: file.name,
                        fileType: file.type,
                        size: file.size
                    });

                    const chunkSize = 16384; // 16KB Chunks
                    const reader = new FileReader();
                    let offset = 0;

                    reader.onload = function(e) {
                        conn.send({
                            type: 'chunk',
                            payload: e.target.result
                        });
                        offset += e.target.result.byteLength;
                        
                        if (offset < file.size) {
                            readNextChunk();
                        } else {
                            document.getElementById('status').innerText = "File sent successfully!";
                        }
                    };

                    function readNextChunk() {
                        const slice = file.slice(offset, offset + chunkSize);
                        reader.readAsArrayBuffer(slice);
                    }

                    readNextChunk();
                });
            });
        }
    }
</script>

</body>
</html>
