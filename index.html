<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ധാര (Dahara) - File Transfer</title>
    <!-- PeerJS ലൈബ്രറി -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #f4f7f6; 
            padding: 20px; 
            color: #333; 
        }
        .container { 
            max-width: 400px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1); 
        }
        h2 { color: #0056b3; margin-bottom: 5px;}
        .subtitle { color: #666; font-size: 14px; margin-bottom: 20px;}
        button { 
            background: #0056b3; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            margin: 10px 0; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%; 
        }
        button:hover { background: #004494; }
        input[type="number"], input[type="file"] { 
            width: 90%; 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px; 
            border: 1px solid #ccc; 
            font-size: 16px; 
        }
        #progressBar { 
            width: 100%; 
            background: #e0e0e0; 
            border-radius: 5px; 
            margin-top: 15px; 
            display: none; 
            overflow: hidden; 
        }
        #progressFill { 
            height: 20px; 
            width: 0%; 
            background: #28a745; 
            transition: width 0.2s; 
        }
        .status { margin-top: 15px; font-weight: bold; color: #d9534f; }
        .info { color: #0056b3; font-size: 14px; margin-top: 5px; font-weight: bold;}
    </style>
</head>
<body>

<div class="container">
    <h2>ധാര (Dahara)</h2>
    <p class="subtitle">അതിവേഗ ലോക്കൽ ഫയൽ ട്രാൻസ്ഫർ</p>

    <!-- റൂം ഉണ്ടാക്കാനും ജോയിൻ ചെയ്യാനുമുള്ള ഭാഗം -->
    <div id="setupSection">
        <button onclick="createRoom()">പുതിയ റൂം ഉണ്ടാക്കുക (Send)</button>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <p>അല്ലെങ്കിൽ</p>
        <input type="number" id="joinPin" placeholder="4-അക്ക PIN അടിക്കുക">
        <button onclick="joinRoom()" style="background: #28a745;">റൂമിൽ ജോയിൻ ചെയ്യുക (Receive)</button>
    </div>

    <!-- PIN കാണിക്കുന്ന ഭാഗം -->
    <div id="roomSection" style="display: none;">
        <h3>നിങ്ങളുടെ PIN: <br><span id="myPinDisplay" style="color: #28a745; font-size: 32px;"></span></h3>
        <p>മറ്റേ ഡിവൈസിൽ ഈ PIN അടിച്ചു ജോയിൻ ചെയ്യുക.</p>
    </div>

    <!-- ഫയൽ അയക്കാനുള്ള ഭാഗം -->
    <div id="transferSection" style="display: none;">
        <input type="file" id="fileInput">
        <button onclick="sendFile()">ഫയൽ അയക്കുക</button>
    </div>

    <!-- സ്റ്റാറ്റസും പ്രോഗ്രസ്സും -->
    <p id="status" class="status"></p>
    
    <div id="progressBar">
        <div id="progressFill"></div>
    </div>
    <p id="speedInfo" class="info"></p>
</div>

<script>
    let peer, conn, selectedFile;
    const prefix = "dahara-local-";

    // കണക്ഷൻ എളുപ്പമാക്കാൻ കൂടുതൽ ഗൂഗിൾ STUN സെർവറുകൾ 
    const peerOptions = {
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' }
            ]
        },
        debug: 1
    };

    function createRoom() {
        let pin = Math.floor(1000 + Math.random() * 9000);
        let myId = prefix + pin;
        
        document.getElementById('status').innerText = "സെർവറുമായി ബന്ധിപ്പിക്കുന്നു...";
        peer = new Peer(myId, peerOptions);
        
        peer.on('open', (id) => {
            document.getElementById('setupSection').style.display = 'none';
            document.getElementById('roomSection').style.display = 'block';
            document.getElementById('myPinDisplay').innerText = pin;
            document.getElementById('status').innerText = "മറ്റേ ഡിവൈസ് കണക്റ്റ് ആകാൻ കാത്തിരിക്കുന്നു...";
        });

        peer.on('error', (err) => {
            document.getElementById('status').innerText = "സെർവർ തിരക്കിലാണ്. പേജ് റീഫ്രഷ് ചെയ്തു വീണ്ടും ശ്രമിക്കുക.";
            console.error(err);
        });

        peer.on('connection', (connection) => {
            conn = connection;
            
            conn.on('open', () => {
                document.getElementById('roomSection').style.display = 'none';
                document.getElementById('transferSection').style.display = 'block';
                document.getElementById('status').innerText = "കണക്റ്റ് ആയി! ഫയൽ സ്വീകരിക്കാൻ തയ്യാറാണ്.";
                document.getElementById('status').style.color = "#28a745";
                setupReceiver();
            });

            conn.on('error', () => {
                document.getElementById('status').innerText = "കണക്ഷൻ തകരാർ. വീണ്ടും ശ്രമിക്കുക.";
                document.getElementById('status').style.color = "#d9534f";
            });
        });
    }

    function joinRoom() {
        let pin = document.getElementById('joinPin').value;
        if(pin.length !== 4) { alert("ശരിയായ 4-അക്ക PIN അടിക്കുക!"); return; }
        
        document.getElementById('status').innerText = "കണക്റ്റ് ചെയ്യുന്നു (ഇതിന് കുറച്ചു സമയം എടുത്തേക്കാം)...";
        peer = new Peer(peerOptions);
        
        peer.on('open', () => {
            conn = peer.connect(prefix + pin, { reliable: true }); // സ്ഥിരതയുള്ള ഡാറ്റ ട്രാൻസ്ഫർ
            
            conn.on('open', () => {
                document.getElementById('setupSection').style.display = 'none';
                document.getElementById('transferSection').style.display = 'block';
                document.getElementById('status').innerText = "കണക്റ്റ് ആയി! ഫയൽ തിരഞ്ഞെടുത്ത് അയക്കുക.";
                document.getElementById('status').style.color = "#28a745";
                setupReceiver();
            });
            
            conn.on('error', () => {
                document.getElementById('status').innerText = "കണക്ഷൻ ലഭിച്ചില്ല. PIN ഒന്നുകൂടി നോക്കുക.";
                document.getElementById('status').style.color = "#d9534f";
            });
        });

        peer.on('error', (err) => {
            document.getElementById('status').innerText = "സെർവർ തിരക്കിലാണ് അല്ലെങ്കിൽ PIN തെറ്റാണ്.";
            document.getElementById('status').style.color = "#d9534f";
            console.error(err);
        });
    }

    function sendFile() {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) { alert("ദയവായി ഒരു ഫയൽ തിരഞ്ഞെടുക്കുക!"); return; }
        
        selectedFile = fileInput.files[0];
        document.getElementById('progressBar').style.display = 'block';
        document.getElementById('status').innerText = "അയച്ചു തുടങ്ങുന്നു...";
        document.getElementById('status').style.color = "#0056b3";
        
        conn.send({ type: 'meta', name: selectedFile.name, size: selectedFile.size, fileType: selectedFile.type });

        const chunkSize = 16384; // 16KB ആയി ചുരുക്കി (ഓവർലോഡ് ഒഴിവാക്കാൻ)
        const reader = new FileReader();
        let offset = 0;

        function readNextChunk() {
            if (conn.dataChannel && conn.dataChannel.bufferedAmount > 1000000) { 
                setTimeout(readNextChunk, 100); 
                return; 
            }
            reader.readAsArrayBuffer(selectedFile.slice(offset, offset + chunkSize));
        }

        reader.onload = e => {
            conn.send(e.target.result);
            offset += e.target.result.byteLength;
            
            let percent = Math.round((offset / selectedFile.size) * 100);
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('speedInfo').innerText = `അയക്കുന്നു: ${percent}% പൂർത്തിയായി`;

            if (offset < selectedFile.size) { 
                readNextChunk(); 
            } else { 
                document.getElementById('status').innerText = "ഫയൽ വിജയകരമായി അയച്ചു! ✅"; 
                document.getElementById('status').style.color = "#28a745";
            }
        };
        
        setTimeout(readNextChunk, 500); // കണക്ഷൻ സെറ്റ് ആകാൻ ചെറിയൊരു ഇടവേള
    }

    function setupReceiver() {
        let fileMeta = {}, receivedBuffers = [], receivedSize = 0;
        conn.on('data', data => {
            if (typeof data === 'object' && data.type === 'meta') {
                fileMeta = data; 
                document.getElementById('progressBar').style.display = 'block';
                document.getElementById('status').innerText = "ഫയൽ സ്വീകരിക്കുന്നു...";
                document.getElementById('status').style.color = "#0056b3";
            } else {
                receivedBuffers.push(data);
                receivedSize += data.byteLength;
                
                let percent = Math.round((receivedSize / fileMeta.size) * 100);
                document.getElementById('progressFill').style.width = percent + '%';
                document.getElementById('speedInfo').innerText = `സ്വീകരിക്കുന്നു: ${percent}% പൂർത്തിയായി`;

                if (receivedSize >= fileMeta.size) {
                    const blob = new Blob(receivedBuffers, { type: fileMeta.fileType });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = fileMeta.name;
                    document.body.appendChild(a); 
                    a.click(); 
                    document.body.removeChild(a);
                    
                    document.getElementById('status').innerText = "ഡൗൺലോഡ് പൂർത്തിയായി! ✅";
                    document.getElementById('status').style.color = "#28a745";
                    receivedBuffers = []; receivedSize = 0;
                }
            }
        });
    }
</script>
</body>
</html>
