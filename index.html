<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dahara - Instant File Share</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 30px auto; padding: 20px; text-align: center; }
    .box { border: 1px solid #ddd; padding: 20px; border-radius: 10px; background: #fafafa; margin-top: 15px; }
    input[type="file"] { margin: 15px 0; width: 100%; }
    button { background: #0d6efd; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; }
    button:disabled { background: #aaa; }
    #qrcode { display: flex; justify-content: center; margin: 15px 0; }
    #status { margin: 15px 0; font-weight: bold; color: #333; }
  </style>
</head>
<body>

  <h2 style="color: #0d6efd; margin-bottom: 5px;">Dahara</h2>
  <p style="font-size: 13px; color: #666; margin-top: 0;">തടസ്സമില്ലാത്ത അതിവേഗ ഫയൽ കൈമാറ്റം</p>

  <div class="box">
    <input type="file" id="fileInput">
    <button id="uploadBtn" onclick="uploadFile()">ഫയൽ അയക്കുക (Get QR)</button>
  </div>

  <div id="status"></div>

  <div id="resultBox" class="box" style="display: none; background: #e8f5e9; border-color: #28a745;">
    <p style="font-weight: bold; margin: 0 0 10px 0;">മൊബൈൽ വഴി സ്കാൻ ചെയ്ത് ഡൗൺലോഡ് ചെയ്യുക:</p>
    <div id="qrcode"></div>
    <a id="downloadLink" href="#" target="_blank" style="word-break: break-all; color: #0d6efd; font-size: 14px;">ഡൗൺലോഡ് ലിങ്ക്</a>
  </div>

  <script>
    async function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      const status = document.getElementById('status');
      const resultBox = document.getElementById('resultBox');
      const qrcodeDiv = document.getElementById('qrcode');
      const downloadLink = document.getElementById('downloadLink');
      const btn = document.getElementById('uploadBtn');

      if (!fileInput.files.length) {
        alert("ദയവായി ഒരു ഫയൽ തിരഞ്ഞെടുക്കുക!");
        return;
      }

      const file = fileInput.files[0];
      const formData = new FormData();
      formData.append('file', file);

      btn.disabled = true;
      status.innerText = "ഫയൽ തയ്യാറാക്കുന്നു... ദയവായി കാത്തിരിക്കുക";
      resultBox.style.display = "none";
      qrcodeDiv.innerHTML = "";

      try {
        // file.io API വഴിയുള്ള അതിവേഗ ട്രാൻസ്ഫർ (1 ഡൗൺലോഡിന് ശേഷം ഫയൽ തനിയെ ഡിലീറ്റ് ആകും)
        const response = await fetch('https://file.io/?expires=1d', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          status.innerText = "വിജയകരമായി പൂർത്തിയായി!";
          resultBox.style.display = "block";
          
          // QR കോഡ് നിർമ്മിക്കുന്നു
          new QRCode(qrcodeDiv, {
            text: data.link,
            width: 160,
            height: 160
          });

          downloadLink.href = data.link;
          downloadLink.innerText = data.link;
        } else {
          status.innerText = "ഫയൽ അപ്‌ലോഡ് പരാജയപ്പെട്ടു. വീണ്ടും ശ്രമിക്കുക.";
        }
      } catch (err) {
        console.error(err);
        status.innerText = "എറർ സംഭവിച്ചു. ഇന്റർനെറ്റ് കണക്ഷൻ പരിശോധിക്കുക.";
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
