<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <title>Local P2P QR File Share (ധാര)</title>
    <!-- ലോക്കൽ പെർഫോമൻസിനായി സ്പീഡ് ഉറപ്പാക്കാൻ ആവശ്യമായ സ്ക്രിപ്റ്റുകൾ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; background: #f0f2f5; }
        .box { background: white; padding: 25px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 420px; }
        input[type="file"] { border: 1px solid #ccc; padding: 10px; border-radius: 6px; width: 90%; background: #fafafa; }
        button { background: #28a745; color: white; border: none; padding: 12px; width: 95%; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #218838; }
        #qrcode { margin: 20px auto; display: flex; justify-content: center; background: #fff; padding: 10px; border-radius: 6px; width: fit-content; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        #status { font-weight: bold; color: #0056b3; margin-top: 15px; font-size: 15px; }
        .progress-bar { width: 100%; background: #e0e0e0; border-radius: 5px; margin-top: 10px; overflow: hidden; height: 12px; display: none; }
        .progress-fill { width: 0%; height: 100%; background: #007bff; transition: width 0.1s ease; }
    </style>
</head>
<body>

<div class="box">
    <h2>ഫയൽ ഷെയറിംഗ് സിസ്റ്റം (Local)</h2>
    
    <div id="sender-section">
        <h3>1. ഫൈൽ സെലക്ട് ചെയ്യുക</h3>
        <input type="file" id="fileInput">
        <br>
        <button onclick="startHosting()">QR കോഡ് പെട്ടെന്ന് ജനറേറ്റ് ചെയ്യുക</button>
        <div id="qrcode"></div>
        <p id="status"></p>
    </div>

    <div id="receiver-section" style="display:none;">
        <h3>ഫയൽ ഡൗൺലോഡ് ആകുന്നു...</h3>
        <p id="receive-status">കണക്റ്റ് ചെയ്യുന്നു...</p>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetPeerId = urlParams.get('peer');

    if (targetPeerId) {
        // സിസ്റ്റം B (റസീവർ ഭാഗം - ഓട്ടോമാറ്റിക് കണക്ഷൻ)
        document.getElementById('sender-section').style.display = 'none';
        document.getElementById('receiver-section').style.display = 'block';
        
        const peer = new Peer();
        peer.on('open', (id) => {
            const conn = peer.connect(targetPeerId);
            
            conn.on('open', () => {
                document.getElementById('receive-status').innerText = "കണക്റ്റ് ആയി! ഫയൽ സ്വീകരിക്കുന്നു...";
                document.getElementById('progressBar').style.display = 'block';
            });

            let receivedSize = 0;
            let totalSize = 0;
            let fileChunks = [];
            let fileMeta = null;

            conn.on('data', (data) => {
                if (data.type === 'meta') {
                    fileMeta = data;
                    totalSize = data.size;
                } else if (data.type === 'chunk') {
                    fileChunks.push(data.payload);
                    receivedSize += data.payload.byteLength;
                    
                    let percent = Math.round((receivedSize / totalSize) * 100);
                    document.getElementById('progressFill').style.width = percent + '%';
                    document.getElementById('receive-status').innerText = `ഡൗൺലോഡ് ആകുന്നു... ${percent}%`;

                    if (receivedSize === totalSize) {
                        const blob = new Blob(fileChunks, { type: fileMeta.fileType });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileMeta.fileName;
                        a.click();
                        document.getElementById('receive-status').innerText = "ഡൗൺലോഡ് പൂർത്തിയായി!";
                    }
                }
            });
        });
    } else {
        // സിസ്റ്റം A (സെൻഡർ ഭാഗം)
        let peer = null;
        function startHosting() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) {
                alert("ദയവായി ഒരു ഫൈൽ സെലക്ട് ചെയ്യുക!");
                return;
            }

            document.getElementById('status').innerText = "സിസ്റ്റം തയ്യാറാകുന്നു...";
            peer = new Peer();

            peer.on('open', (id) => {
                const currentUrl = window.location.href.split('?')[0];
                const shareLink = `${currentUrl}?peer=${id}`;

                // ക്ലിയർ ചെയ്ത് instant ആയി QR കോഡ് വരയ്ക്കുന്നു
                const qrContainer = document.getElementById("qrcode");
                qrContainer.innerHTML = "";
                new QRCode(qrContainer, {
                    text: shareLink,
                    width: 180,
                    height: 180,
                    correctLevel: QRCode.CorrectLevel.M
                });

                document.getElementById('status').innerText = "QR കോഡ് സ്കാൻ ചെയ്യുക!";
            });

            peer.on('connection', (conn) => {
                document.getElementById('status').innerText = "ഡിിവൈസ് കണക്റ്റ് ചെയ്തു, ഫയൽ അയക്കുന്നു...";
                const file = fileInput.files[0];
                
                // വലിയ ഫയലുകൾ തടസ്സമില്ലാതെ അയക്കാൻ ചാങ്ക്‌സ് ആയി മാറ്റുന്നു
                conn.on('open', () => {
                    conn.send({
                        type: 'meta',
                        fileName: file.name,
                        fileType: file.type,
                        size: file.size
                    });

                    const chunkSize = 16384; // 16KB Chunks
                    const reader = new FileReader();
                    let offset = 0;

                    reader.onload = function(e) {
                        conn.send({
                            type: 'chunk',
                            payload: e.target.result
                        });
                        offset += e.target.result.byteLength;
                        if (offset < file.size) {
                            readNextChunk();
                        } else {
                            document.getElementById('status').innerText = "ഫയൽ വിജയകരമായി അയച്ചു!";
                        }
                    };

                    function readNextChunk() {
                        const slice = file.slice(offset, offset + chunkSize);
                        reader.readAsArrayBuffer(slice);
                    }

                    readNextChunk();
                });
            });
        }
    }
</script>

</body>
</html>
