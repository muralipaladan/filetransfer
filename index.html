<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Fast QR File Transfer</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui;background:#0f172a;color:#e2e8f0;max-width:460px;margin:0 auto;padding:16px}
    h1{text-align:center;color:#38bdf8;font-size:1.35rem;margin-bottom:14px}
    .card{background:#1e293b;border-radius:14px;padding:16px;margin-bottom:14px}
    .status{text-align:center;padding:11px;border-radius:10px;background:#334155;margin-bottom:12px;font-size:.95rem}
    .connected{background:#065f46;color:#a7f3d0}
    #qrcode{background:#fff;padding:12px;border-radius:10px;width:fit-content;margin:10px auto}
    input[type=text],input[type=file]{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#0f172a;color:#e2e8f0;font-size:15px}
    input[type=file]{background:#334155;border:2px dashed #64748b}
    button{width:100%;padding:13px;margin:6px 0;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
    .btn-blue{background:#0ea5e9;color:#fff}
    .btn-green{background:#10b981;color:#fff}
    .btn-gray{background:#475569;color:#fff}
    .btn-red{background:#ef4444;color:#fff}
    button:disabled{opacity:.5}
    #reader{width:100%;border-radius:10px;overflow:hidden;margin:8px 0}
    .file{background:#334155;border-radius:9px;padding:10px;margin:7px 0;font-size:14px}
    .name{font-weight:600;margin-bottom:5px;word-break:break-all}
    .bar-bg{height:7px;background:#475569;border-radius:4px;overflow:hidden;margin:5px 0}
    .bar{height:100%;background:linear-gradient(90deg,#0ea5e9,#38bdf8);width:0%;transition:width .15s}
    .txt{font-size:12px;color:#94a3b8}
    .hidden{display:none!important}
    .small{font-size:13px;color:#94a3b8;text-align:center;margin-top:6px}
    .id{font-size:12px;color:#64748b;text-align:center;word-break:break-all;user-select:all;margin-top:6px}
    .or{text-align:center;color:#64748b;font-size:13px;margin:12px 0 6px}
  </style>
</head>
<body>
  <h1>📁 Fast File Transfer</h1>

  <!-- Connect Section -->
  <div class="card" id="connectCard">
    <div class="status" id="status">തയ്യാറാക്കുന്നു...</div>

    <div id="qrSection">
      <p class="small">നിങ്ങളുടെ QR (മറ്റേ ഡിവൈസ് സ്കാൻ ചെയ്യട്ടെ)</p>
      <div id="qrcode"></div>
      <div class="id" id="myId"></div>
    </div>

    <div class="or">—— അല്ലെങ്കിൽ Manual ID ——</div>
    <input type="text" id="manualId" placeholder="മറ്റേ ഡിവൈസിന്റെ ID ഒട്ടിക്കുക">
    <button class="btn-gray" onclick="manualConnect()">🔗 Connect</button>

    <button class="btn-blue" id="scanBtn" onclick="startScan()">📷 QR സ്കാൻ ചെയ്യുക</button>
    <div id="reader" class="hidden"></div>
    <button class="btn-red hidden" id="stopBtn" onclick="stopScan()">സ്കാൻ നിർത്തുക</button>
  </div>

  <!-- Transfer Section -->
  <div class="card hidden" id="transferCard">
    <div class="status connected">✅ Connected – ഫയൽ അയയ്ക്കാം</div>
    <input type="file" id="fileInput" multiple>
    <button class="btn-green" id="sendBtn" onclick="sendFiles()" disabled>📤 ഫയലുകൾ അയയ്ക്കുക</button>
    <div id="outList"></div>
    <div id="inList"></div>
  </div>

<script>
let peer, conn, myId, scanner = null;
const CHUNK = 64 * 1024; // 64KB – വേഗതയ്ക്ക്
const incoming = {};

peer = new Peer({
  debug: 0,
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' }
    ]
  }
});

peer.on('open', id => {
  myId = id;
  document.getElementById('status').textContent = 'QR / ID തയ്യാറാണ്';
  document.getElementById('myId').textContent = 'ID: ' + id;
  const box = document.getElementById('qrcode');
  box.innerHTML = '';
  new QRCode(box, { text: id, width: 190, height: 190, correctLevel: QRCode.CorrectLevel.M });
});

peer.on('connection', c => setup(c));
peer.on('error', e => {
  document.getElementById('status').textContent = 'Error: ' + (e.type || e);
});

function setup(c) {
  if (conn) return;
  conn = c;
  conn.binaryType = 'arraybuffer';

  document.getElementById('connectCard').classList.add('hidden');
  document.getElementById('transferCard').classList.remove('hidden');
  document.getElementById('sendBtn').disabled = false;
  stopScan();

  conn.on('data', onData);
  conn.on('close', () => {
    alert('Connection closed');
    location.reload();
  });
}

function manualConnect() {
  const id = document.getElementById('manualId').value.trim();
  if (!id) return alert('ID ഇടുക');
  if (id === myId) return alert('സ്വന്തം ID ആണ്');
  document.getElementById('status').textContent = 'കണക്ട് ചെയ്യുന്നു...';
  const c = peer.connect(id, { reliable: true, serialization: 'binary' });
  c.on('open', () => setup(c));
  c.on('error', () => {
    document.getElementById('status').textContent = 'Connect failed';
    alert('Connect failed – ID ശരിയാണോ?');
  });
}

function startScan() {
  document.getElementById('reader').classList.remove('hidden');
  document.getElementById('scanBtn').classList.add('hidden');
  document.getElementById('stopBtn').classList.remove('hidden');
  document.getElementById('qrSection').classList.add('hidden');

  scanner = new Html5Qrcode('reader');
  scanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: 230 },
    text => {
      stopScan();
      if (text === myId) return alert('സ്വന്തം QR');
      document.getElementById('status').textContent = 'കണക്ട് ചെയ്യുന്നു...';
      const c = peer.connect(text, { reliable: true, serialization: 'binary' });
      c.on('open', () => setup(c));
    },
    () => {}
  ).catch(err => {
    alert('Camera error: ' + err);
    stopScan();
  });
}

function stopScan() {
  if (scanner) {
    scanner.stop().then(() => scanner.clear()).catch(() => {});
    scanner = null;
  }
  document.getElementById('reader').classList.add('hidden');
  document.getElementById('scanBtn').classList.remove('hidden');
  document.getElementById('stopBtn').classList.add('hidden');
  document.getElementById('qrSection').classList.remove('hidden');
}

function sendFiles() {
  const files = document.getElementById('fileInput').files;
  if (!files.length || !conn?.open) return alert('ഫയൽ സെലക്ട് ചെയ്യുക');

  [...files].forEach((file, i) => {
    const id = Date.now() + '-' + i;
    addItem(id, file.name, file.size, 'out');

    conn.send({ t: 'm', id, n: file.name, s: file.size });

    let offset = 0;
    const reader = new FileReader();

    reader.onload = e => {
      if (!conn?.open) return;
      conn.send({ t: 'c', id, d: e.target.result });
      offset += e.target.result.byteLength;
      update(id, offset, file.size);
      if (offset < file.size) next();
      else {
        conn.send({ t: 'd', id });
        done(id);
      }
    };

    function next() {
      reader.readAsArrayBuffer(file.slice(offset, offset + CHUNK));
    }
    next();
  });
  document.getElementById('fileInput').value = '';
}

function onData(data) {
  if (data.t === 'm') {
    incoming[data.id] = { name: data.n, size: data.s, parts: [], got: 0 };
    addItem(data.id, data.n, data.s, 'in');
  }
  else if (data.t === 'c') {
    const f = incoming[data.id];
    if (!f) return;
    f.parts.push(data.d);
    f.got += data.d.byteLength;
    update(data.id, f.got, f.size);
  }
  else if (data.t === 'd') {
    const f = incoming[data.id];
    if (!f) return;
    const blob = new Blob(f.parts);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = f.name;
    a.click();
    URL.revokeObjectURL(a.href);
    done(data.id);
    delete incoming[data.id];
  }
}

function addItem(id, name, size, dir) {
  const list = document.getElementById(dir === 'out' ? 'outList' : 'inList');
  const div = document.createElement('div');
  div.className = 'file';
  div.id = 'f' + id;
  div.innerHTML = `
    <div class="name">${dir === 'out' ? '📤' : '📥'} ${name}</div>
    <div class="bar-bg"><div class="bar" id="b${id}"></div></div>
    <div class="txt" id="t${id}">0% • 0 / ${fmt(size)}</div>`;
  list.appendChild(div);
}

function update(id, got, total) {
  const pct = Math.min(100, Math.round(got / total * 100));
  const bar = document.getElementById('b' + id);
  const txt = document.getElementById('t' + id);
  if (bar) bar.style.width = pct + '%';
  if (txt) txt.textContent = pct + '% • ' + fmt(got) + ' / ' + fmt(total);
}

function done(id) {
  const txt = document.getElementById('t' + id);
  const bar = document.getElementById('b' + id);
  if (txt) txt.textContent = '✅ Completed';
  if (bar) { bar.style.width = '100%'; bar.style.background = '#10b981'; }
}

function fmt(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}
</script>
</body>
</html>
