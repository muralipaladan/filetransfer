<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <title>KUMBIDI Micro QR Share</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background: #f0f2f5; color: #333; }
        .container { background: white; max-width: 500px; margin: auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: left; }
        h2 { text-align: center; color: #007bff; margin-bottom: 5px; }
        p.sub { text-align: center; font-size: 13px; color: #666; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        button { flex: 1; background: #007bff; color: white; border: none; padding: 12px; font-size: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        button.secondary { background: #28a745; }
        button.secondary:hover { background: #218838; }
        input[type="file"] { border: 1px solid #ccc; padding: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; background: #fafafa; margin-bottom: 12px; font-size: 13px; }
        .card { background: #f8f9fa; border: 1px solid #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: none; text-align: center; }
        #qrcode, #answer-qrcode { display: flex; justify-content: center; margin: 15px 0; background: white; padding: 10px; border-radius: 8px; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 10px; }
        .progress-bar { width: 100%; background: #e0e0e0; border-radius: 5px; overflow: hidden; height: 16px; margin-top: 10px; display: none; }
        .progress-fill { width: 0%; height: 100%; background: #28a745; transition: width 0.05s ease; }
        #status { font-weight: bold; color: #d9534f; font-size: 14px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>KUMBIDI Micro QR</h2>
    <p class="sub">പെട്ടെന്ന് സ്കാൻ ചെയ്യാവുന്ന ചെറിയ QR കോഡ്</p>

    <div class="btn-group">
        <button onclick="showSender()">Send (അയക്കാൻ)</button>
        <button class="secondary" onclick="showReceiver()">Receive (സ്വീകരിക്കാൻ)</button>
    </div>

    <!-- SENDER -->
    <div id="sender-section" class="card">
        <h3>1. ഫയൽ തിരഞ്ഞെടുക്കുക:</h3>
        <input type="file" id="fileInput">
        <button onclick="createOffer()" style="background: #ffc107; color: #000;">ചെറിയ QR ഉണ്ടാക്കുക</button>
        
        <div id="sender-step2" style="display:none; margin-top: 15px;">
            <p style="font-size: 13px;">ഈ ചെറിയ QR കോഡ് റിസീവർ സ്കാൻ ചെയ്യട്ടെ:</p>
            <div id="qrcode"></div>
            <button onclick="startScannerForAnswer()" class="secondary" style="margin-top: 10px;">റിസീവറുടെ QR സ്കാൻ ചെയ്യുക</button>
        </div>
    </div>

    <!-- RECEIVER -->
    <div id="receiver-section" class="card">
        <h3>കണക്റ്റ് ചെയ്യാൻ:</h3>
        <button onclick="startScannerForOffer()" class="secondary">സെൻഡറുടെ QR സ്കാൻ ചെയ്യുക</button>
        <div id="reader"></div>

        <div id="receiver-step2" style="display:none; margin-top: 15px;">
            <p style="font-size: 13px; color: #28a745; font-weight: bold;">ലഭിച്ചു! ഈ ചെറിയ QR കോഡ് സെൻഡറെ കാണിക്കുക:</p>
            <div id="answer-qrcode"></div>
        </div>
    </div>

    <!-- STATUS -->
    <div id="transfer-card" class="card" style="display:block;">
        <h3>സ്റ്റാറ്റസ്</h3>
        <p id="status">ഡിവൈസ് തയ്യാറാണ്...</p>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <p id="speedInfo" style="font-size: 12px; color: #666; margin-top: 5px;"></p>
    </div>
</div>

<script>
    let pc, dataChannel, selectedFile, html5QrCode;

    function showSender() {
        document.getElementById('sender-section').style.display = 'block';
        document.getElementById('receiver-section').style.display = 'none';
        document.getElementById('status').innerText = "സെൻഡർ മോഡ് സജീവമാണ്.";
    }

    function showReceiver() {
        document.getElementById('sender-section').style.display = 'none';
        document.getElementById('receiver-section').style.display = 'block';
        document.getElementById('status').innerText = "റിസീവർ മോഡ് സജീവമാണ്.";
    }

    function createPeerConnection() {
        pc = new RTCPeerConnection({ iceServers: [] });
    }

    // SDP കോഡ് ചുരുക്കി അത്യാവശ്യ ഭാഗം മാത്രം എടുക്കുന്ന ഫങ്ഷൻ
    function compactSDP(sdpObj) {
        let candidateLine = "";
        const lines = sdpObj.sdp.split('\r\n');
        for (let line of lines) {
            if (line.startsWith('a=candidate') && (line.includes('typ host') || line.includes('.local'))) {
                candidateLine = line;
                break;
            }
        }
        return JSON.stringify({
            t: sdpObj.type,
            u: pc.localDescription.sctp ? 5000 : 0,
            c: candidateLine,
            f: getFingerprint(sdpObj.sdp)
        });
    }

    function getFingerprint(sdp) {
        const match = sdp.match(/a=fingerprint:sha-256\s+([A-F0-9:]+)/i);
        return match ? match[1] : "";
    }

    function expandSDP(compactObj, type) {
        return {
            type: type,
            sdp: `v=0\r\no=- 0 2 IN IP4 127.0.0.1\r\ns=-\r\nt=0 0\r\na=group:BUNDLE 0\r\nm=application 9 UDP/DTLS/SCTP webrtc-datachannel\r\nc=IN IP4 0.0.0.0\r\n${compactObj.c}\r\na=ice-ufrag:test\r\na=ice-pwd:testpwd\r\na=fingerprint:sha-256 ${compactObj.f}\r\na=setup:actpass\r\na=mid:0\r\na=sctp-port:5000\r\n`
        };
    }

    let compactOffer, compactAnswer;

    function createOffer() {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) {
            alert("ഫയൽ തിരഞ്ഞെടുക്കൂ!");
            return;
        }
        selectedFile = fileInput.files[0];

        createPeerConnection();
        dataChannel = pc.createDataChannel("fileTransfer");
        setupDataChannel();

        pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => {
            setTimeout(() => {
                compactOffer = compactSDP(pc.localDescription);
                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById("qrcode"), {
                    text: compactOffer,
                    width: 180,
                    height: 180,
                    correctLevel: QRCode.CorrectLevel.L
                });
                document.getElementById('sender-step2').style.display = 'block';
                document.getElementById('status').innerText = "ചെറിയ QR കോഡ് സ്കാൻ ചെയ്യാം.";
            }, 800);
        });
    }

    function startScannerForAnswer() {
        document.getElementById('sender-step2').innerHTML = '<div id="reader-ans" style="width:100%;"></div>';
        const scanner = new Html5Qrcode("reader-ans");
        scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 180 }, decodedText => {
            scanner.stop();
            const ansObj = JSON.parse(decodedText);
            const fullAns = expandSDP(ansObj, 'answer');
            pc.setRemoteDescription(fullAns).then(() => {
                document.getElementById('status').innerText = "കണക്റ്റ് ആകുന്നു...";
            });
        }, err => {});
    }

    function startScannerForOffer() {
        createPeerConnection();
        pc.ondatachannel = e => {
            dataChannel = e.channel;
            setupReceiverDataChannel();
        };

        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 180 }, decodedText => {
            html5QrCode.stop().then(() => {
                document.getElementById('reader').style.display = 'none';
                const offObj = JSON.parse(decodedText);
                const fullOff = expandSDP(offObj, 'offer');

                pc.setRemoteDescription(fullOff).then(() => pc.createAnswer()).then(a => pc.setLocalDescription(a)).then(() => {
                    setTimeout(() => {
                        compactAnswer = compactSDP(pc.localDescription);
                        document.getElementById('answer-qrcode').innerHTML = "";
                        new QRCode(document.getElementById("answer-qrcode"), {
                            text: compactAnswer,
                            width: 180,
                            height: 180,
                            correctLevel: QRCode.CorrectLevel.L
                        });
                        document.getElementById('receiver-step2').style.display = 'block';
                        document.getElementById('status').innerText = "ഈ QR കോഡ് സെൻഡറെ കാണിക്കുക.";
                    }, 800);
                });
            });
        }, err => {});
    }

    function setupDataChannel() {
        dataChannel.onopen = () => {
            document.getElementById('status').innerText = "കണക്റ്റ് ആയി! ഫയൽ അയക്കുന്നു...";
            document.getElementById('progressBar').style.display = 'block';
            
            dataChannel.send(JSON.stringify({
                type: 'meta', name: selectedFile.name, size: selectedFile.size, fileType: selectedFile.type
            }));

            const chunkSize = 16384;
            const reader = new FileReader();
            let offset = 0;

            reader.onload = e => {
                dataChannel.send(e.target.result);
                offset += e.target.result.byteLength;
                let percent = Math.round((offset / selectedFile.size) * 100);
                document.getElementById('progressFill').style.width = percent + '%';
                document.getElementById('speedInfo').innerText = `Progress: ${percent}%`;

                if (offset < selectedFile.size) {
                    readNextChunk();
                } else {
                    document.getElementById('status').innerText = "ഫയൽ അയച്ചു തീർന്നു!";
                }
            };
            function readNextChunk() {
                reader.readAsArrayBuffer(selectedFile.slice(offset, offset + chunkSize));
            }
            readNextChunk();
        };
    }

    let fileMeta = {}, receivedBuffers = [], receivedSize = 0;
    function setupReceiverDataChannel() {
        dataChannel.onopen = () => {
            document.getElementById('status').innerText = "കണക്റ്റ് ആയി! സ്വീകരിക്കുന്നു...";
            document.getElementById('progressBar').style.display = 'block';
        };
        dataChannel.onmessage = e => {
            if (typeof e.data === 'string') {
                const d = JSON.parse(e.data);
                if (d.type === 'meta') fileMeta = d;
            } else {
                receivedBuffers.push(e.data);
                receivedSize += e.data.byteLength;
                let percent = Math.round((receivedSize / fileMeta.size) * 100);
                document.getElementById('progressFill').style.width = percent + '%';
                document.getElementById('speedInfo').innerText = `Progress: ${percent}%`;

                if (receivedSize >= fileMeta.size) {
                    const blob = new Blob(receivedBuffers, { type: fileMeta.fileType });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = fileMeta.name; a.click();
                    document.getElementById('status').innerText = "ഡൗൺലോഡ് പൂർത്തിയായി!";
                }
            }
        };
    }
</script>

</body>
</html>
