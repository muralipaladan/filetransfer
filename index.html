<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <title>KUMBIDI Continuous Radar</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background: #f0f2f5; color: #333; }
        .container { background: white; max-width: 500px; margin: auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: left; }
        h2 { text-align: center; color: #007bff; margin-bottom: 5px; }
        p.sub { text-align: center; font-size: 13px; color: #666; margin-bottom: 20px; }
        
        .radar-box { text-align: center; padding: 20px; background: #e8f4fd; border-radius: 10px; margin-bottom: 15px; border: 1px dashed #007bff; }
        .pulse { width: 20px; height: 20px; background: #d9534f; border-radius: 50%; margin: 0 auto 10px; box-shadow: 0 0 0 rgba(217, 83, 79, 0.4); animation: pulse 1.2s infinite; }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(217, 83, 79, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(217, 83, 79, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(217, 83, 79, 0); }
        }

        input[type="file"] { border: 1px solid #ccc; padding: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; background: #fafafa; margin-bottom: 12px; font-size: 15px; }
        .card { background: #f8f9fa; border: 1px solid #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .progress-bar { width: 100%; background: #e0e0e0; border-radius: 5px; overflow: hidden; height: 16px; margin-top: 10px; display: none; }
        .progress-fill { width: 0%; height: 100%; background: #28a745; transition: width 0.05s ease; }
        #status { font-weight: bold; color: #007bff; font-size: 14px; text-align: center; margin-top: 10px; }
        .device-btn { background: #28a745; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; margin-top: 8px; cursor: pointer; font-weight: bold; }
        .device-btn:hover { background: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>KUMBIDI Radar</h2>
    <p class="sub">അടുത്തുള്ള ഡിവൈസ് കണ്ടുപിടിക്കുന്നത് വരെ പരതുന്നു</p>

    <!-- STEP 1: SELECT FILE -->
    <div class="card">
        <h3>1. അയക്കേണ്ട ഫയൽ തിരഞ്ഞെടുക്കുക:</h3>
        <input type="file" id="fileInput">
    </div>

    <!-- RADAR PRESENCE SECTION -->
    <div class="radar-box">
        <div class="pulse"></div>
        <div id="myPresenceStatus" style="font-size: 14px; font-weight: bold; color: #007bff;">റേഡാർ സജീവമാണ്...</div>
        <p style="font-size: 12px; color: #555; margin: 5px 0 0 0;">മറ്റൊരു ഡിവൈസ് സിഗ്നൽ തരുന്നതുവരെ തിരയുന്നു</p>
    </div>

    <!-- DETECTED DEVICES LIST -->
    <div class="card" id="deviceListCard" style="display:none;">
        <h3>കണ്ടെത്തിയ ഡിവൈസുകൾ:</h3>
        <div id="detectedDevices"></div>
    </div>

    <!-- STATUS -->
    <div class="card">
        <h3>സ്റ്റാറ്റസ്</h3>
        <p id="status">ഫയൽ തിരഞ്ഞെടുത്ത് കാത്തിരിക്കൂ...</p>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <p id="speedInfo" style="font-size: 12px; color: #666; margin-top: 5px; text-align: center;"></p>
    </div>
</div>

<script>
    let peer, selectedFile, myId;
    const groupKey = "kumbidi-room-2026-";
    const randomSuffix = Math.floor(1000 + Math.random() * 9000); // കൂടുതൽ നമ്പറുകൾ (1000 മുതൽ 9999 വരെ)
    myId = groupKey + randomSuffix;

    const peerOptions = {
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        }
    };

    let searchInterval;

    window.onload = function() {
        peer = new Peer(myId, peerOptions);

        peer.on('open', (id) => {
            document.getElementById('myPresenceStatus').innerText = "നിങ്ങളുടെ ഐഡി: " + id;
            document.getElementById('status').innerText = "റേഡാർ ഓൺ ആണ്. അടുത്തുള്ള ഡിവൈസിനായി തിരയുന്നു...";
            
            // ഡിവൈസ് കിട്ടുന്നത് വരെ തുടർച്ചയായി പരതുന്നു
            startContinuousScanning();
        });

        peer.on('connection', (connection) => {
            document.getElementById('status').innerText = "മറ്റൊരു ഡിവൈസ് നിങ്ങളുമായി ബന്ധപ്പെട്ടു! ഫയൽ സ്വീകരിക്കുന്നു...";
            clearInterval(searchInterval); // ഡിവൈസ് കിട്ടിയാൽ തിരച്ചിൽ നിർത്തുന്നു
            setupReceiver(connection);
        });

        peer.on('error', (err) => {
            console.log("Peer error: " + err.type);
        });
    };

    function startContinuousScanning() {
        document.getElementById('deviceListCard').style.display = 'block';
        let container = document.getElementById('detectedDevices');
        let currentTry = 1000;

        // ഓരോ 1.5 സെക്കൻഡിലും അടുത്തടുത്തുള്ള ഐഡികൾ തുടർച്ചയായി പരിശോധിച്ചുകൊണ്ടിരിക്കും
        searchInterval = setInterval(() => {
            if(currentTry > 9999) currentTry = 1000; // ലൂപ്പ് റീസെറ്റ് ചെയ്യുന്നു
            let targetId = groupKey + currentTry;

            if(targetId !== myId) {
                let tempPeer = new Peer();
                tempPeer.on('open', () => {
                    let conn = tempPeer.connect(targetId);
                    conn.on('open', () => {
                        container.innerHTML = `
                            <div style="background:#fff; padding:10px; border:1px solid #ddd; border-radius:6px; margin-bottom:5px;">
                                <span style="font-size:13px; font-weight:bold; color:#28a745;">✨ ഡിവൈസ് കണ്ടെത്തി! (${targetId})</span>
                                <button class="device-btn" onclick="connectAndSend('${targetId}')">ഫയൽ ഇങ്ങോട്ട് അയക്കൂ</button>
                            </div>
                        `;
                        document.getElementById('status').innerText = "അടുത്തുള്ള ഡിവൈസ് സാന്നിധ്യം തിരിച്ചറിഞ്ഞു!";
                        tempPeer.destroy();
                    });
                    setTimeout(() => {
                        tempPeer.destroy();
                    }, 800);
                });
            }
            currentTry++;
        }, 1500);
    }

    function connectAndSend(targetId) {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) {
            alert("ദയവായി ആദ്യം മുകളിൽ നിന്ന് അയക്കേണ്ട ഫയൽ തിരഞ്ഞെടുക്കുക!");
            return;
        }
        selectedFile = fileInput.files[0];
        document.getElementById('status').innerText = `${targetId} -ലേക്ക് കണക്റ്റ് ചെയ്യുന്നു...`;
        clearInterval(searchInterval);

        let senderPeer = new Peer(peerOptions);
        senderPeer.on('open', () => {
            let conn = senderPeer.connect(targetId);
            
            conn.on('open', () => {
                document.getElementById('status').innerText = "കണക്റ്റ് ആയി! ഫയൽ കൈമാറ്റം തുടങ്ങുന്നു...";
                sendFileData(conn);
            });
        });
    }

    function sendFileData(conn) {
        document.getElementById('progressBar').style.display = 'block';
        
        conn.send({
            type: 'meta',
            name: selectedFile.name,
            size: selectedFile.size,
            fileType: selectedFile.type
        });

        const chunkSize = 16384;
        const reader = new FileReader();
        let offset = 0;

        reader.onload = e => {
            conn.send(e.target.result);
            offset += e.target.result.byteLength;
            let percent = Math.round((offset / selectedFile.size) * 100);
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('speedInfo').innerText = `പുരോഗതി: ${percent}%`;

            if (offset < selectedFile.size) {
                readNextChunk();
            } else {
                document.getElementById('status').innerText = "ഫയൽ വിജയകരമായി അയച്ചു തീർന്നു!";
            }
        };

        function readNextChunk() {
            reader.readAsArrayBuffer(selectedFile.slice(offset, offset + chunkSize));
        }

        readNextChunk();
    }

    function setupReceiver(conn) {
        document.getElementById('progressBar').style.display = 'block';
        let fileMeta = {}, receivedBuffers = [], receivedSize = 0;

        conn.on('data', data => {
            if (typeof data === 'object' && data.type === 'meta') {
                fileMeta = data;
            } else {
                receivedBuffers.push(data);
                receivedSize += data.byteLength;
                let percent = Math.round((receivedSize / fileMeta.size) * 100);
                document.getElementById('progressFill').style.width = percent + '%';
                document.getElementById('speedInfo').innerText = `പുരോഗതി: ${percent}%`;

                if (receivedSize >= fileMeta.size) {
                    document.getElementById('status').innerText = "ഫയൽ ഡൗൺലോഡ് തയ്യാറാക്കുന്നു...";
                    
                    const blob = new Blob(receivedBuffers, { type: fileMeta.fileType });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileMeta.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    
                    document.getElementById('status').innerText = "ഡൗൺലോഡ് പൂർത്തിയായി!";
                }
            }
        });
    }
</script>

</body>
</html>
