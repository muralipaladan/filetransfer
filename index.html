<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P File Transfer</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font-family: system-ui; max-width: 500px; margin: 40px auto; padding: 20px; }
    input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    #status { margin: 15px 0; padding: 10px; background: #f0f0f0; border-radius: 8px; }
    progress { width: 100%; height: 20px; }
  </style>
</head>
<body>
  <h2>📁 P2P File Transfer</h2>
  <p>നിങ്ങളുടെ ID: <strong id="my-id">...</strong></p>
  
  <input type="text" id="peer-id" placeholder="മറ്റേ ഡിവൈസിന്റെ ID ഇവിടെ ഇടുക">
  <button onclick="connect()">Connect</button>
  
  <div id="status">കണക്ഷൻ കാത്തിരിക്കുന്നു...</div>
  
  <input type="file" id="file-input" disabled>
  <button id="send-btn" onclick="sendFile()" disabled>Send File</button>
  
  <progress id="progress" value="0" max="100" style="display:none"></progress>
  <div id="log"></div>

  <script>
    const peer = new Peer(); // random ID
    let conn = null;

    peer.on('open', id => {
      document.getElementById('my-id').textContent = id;
      document.getElementById('status').textContent = 'നിങ്ങളുടെ ID: ' + id + ' (മറ്റേ ഡിവൈസിലേക്ക് പങ്കിടുക)';
    });

    peer.on('connection', c => {
      conn = c;
      setupConnection();
      document.getElementById('status').textContent = 'Connected! ഫയൽ അയയ്ക്കാം.';
      enableSend();
    });

    function connect() {
      const id = document.getElementById('peer-id').value.trim();
      if (!id) return alert('ID ഇടുക');
      conn = peer.connect(id);
      setupConnection();
    }

    function setupConnection() {
      conn.on('open', () => {
        document.getElementById('status').textContent = 'Connected!';
        enableSend();
      });

      conn.on('data', data => {
        if (data.fileName) {
          // File metadata
          window.incomingFile = { name: data.fileName, size: data.fileSize, chunks: [] };
          document.getElementById('status').textContent = 'Receiving: ' + data.fileName;
        } else if (data.chunk) {
          window.incomingFile.chunks.push(data.chunk);
          const received = window.incomingFile.chunks.reduce((a, b) => a + b.byteLength, 0);
          const pct = Math.round((received / window.incomingFile.size) * 100);
          document.getElementById('progress').style.display = 'block';
          document.getElementById('progress').value = pct;

          if (received >= window.incomingFile.size) {
            const blob = new Blob(window.incomingFile.chunks);
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = window.incomingFile.name;
            a.click();
            document.getElementById('status').textContent = 'ഡൗൺലോഡ് പൂർത്തിയായി!';
          }
        }
      });
    }

    function enableSend() {
      document.getElementById('file-input').disabled = false;
      document.getElementById('send-btn').disabled = false;
    }

    function sendFile() {
      const file = document.getElementById('file-input').files[0];
      if (!file || !conn) return;

      conn.send({ fileName: file.name, fileSize: file.size });

      const chunkSize = 16 * 1024; // 16KB
      let offset = 0;
      const reader = new FileReader();

      reader.onload = e => {
        conn.send({ chunk: e.target.result });
        offset += e.target.result.byteLength;
        document.getElementById('progress').style.display = 'block';
        document.getElementById('progress').value = Math.round((offset / file.size) * 100);

        if (offset < file.size) {
          readNext();
        } else {
          document.getElementById('status').textContent = 'അയച്ചു!';
        }
      };

      function readNext() {
        const slice = file.slice(offset, offset + chunkSize);
        reader.readAsArrayBuffer(slice);
      }
      readNext();
    }
  </script>
</body>
</html>
